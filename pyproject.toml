[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bill-reader"
version = "0.1.0"
description = "Multilingual (English/Sinhala/Tamil) bill reader that proposes MYOB account codes and exports AccountRight import files"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlmodel>=0.0.16",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pypdfium2>=4.28",
  "pillow>=10.3",
  "pillow-heif>=0.16",
  "watchdog>=4.0",
  "openai>=1.30",
  "anthropic>=1.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
surya = ["surya-ocr>=0.22,<0.23"]
dev = ["pytest>=8"]

[project.scripts]
bill-reader = "bill_reader.cli:main"

[tool.setuptools.packages.find]
include = ["bill_reader*"]

[tool.setuptools.package-data]
bill_reader = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
