# Model profiles. Switch models by changing `extraction` / `categorisation` below,
# by setting BILL_READER_EXTRACTION_PROFILE / BILL_READER_CATEGORISATION_PROFILE,
# or on the Settings page. API keys are read only from the env var each profile names.
#
# provider: openai_compatible (GLM/Z.ai, DeepSeek, OpenAI, OpenRouter, ...) | anthropic
# supports_vision: false  -> profile is used in "ocr+text" mode (needs Surya installed)
# structured output strategy: tools -> json_mode -> prompt-only JSON (first the profile supports)
# price_*_per_m: USD per 1M tokens, only used for eval cost estimates (verify current pricing).

# Default chosen from the 11-model comparison (docs/model-selection.md, 2026-10-19):
# gpt-5.5 read 5/5 totals, suppliers and bill numbers at ~11 s/bill. DeepSeek (also 5/5 totals)
# is the fallback so an OpenAI outage doesn't stop processing.
extraction: openai-gpt-5.5
fallback_chain: [openai-gpt-5.5, deepseek-vision, openai-gpt-5.6-sol]
categorisation: deepseek-text

profiles:
  glm-vision:
    provider: openai_compatible
    base_url: https://api.z.ai/api/paas/v4
    model: glm-4.6v                 # docs.z.ai/guides/vlm/glm-4.6v
    api_key_env: ZAI_API_KEY
    supports_vision: true
    supports_tools: false           # tool calls returned stringified objects for the nested schema -> JSON mode
    supports_json_mode: true
    extra_body: {thinking: {type: disabled}}
    price_in_per_m: 0.30
    price_out_per_m: 0.90

  glm-vision-flash:
    provider: openai_compatible
    base_url: https://api.z.ai/api/paas/v4
    model: glm-4.6v-flash           # free tier variant
    api_key_env: ZAI_API_KEY
    supports_vision: true
    supports_tools: false           # tool calls returned stringified objects for the nested schema -> JSON mode
    supports_json_mode: true
    extra_body: {thinking: {type: disabled}}
    price_in_per_m: 0.0
    price_out_per_m: 0.0

  deepseek-vision:
    provider: openai_compatible
    base_url: https://api.deepseek.com
    model: deepseek-flash           # api-docs.deepseek.com/guides/vision
    api_key_env: DEEPSEEK_API_KEY
    supports_vision: true
    supports_tools: false           # thinking mode rejects forced tool_choice (400) -> use JSON mode
    supports_json_mode: true
    max_tokens: 8192                # thinking tokens count against the limit; 4096 sometimes left no answer
    price_in_per_m: 0.27            # verify
    price_out_per_m: 1.10           # verify

  deepseek-text:
    provider: openai_compatible
    base_url: https://api.deepseek.com
    model: deepseek-chat            # text-only; used in ocr+text mode and for categorisation
    api_key_env: DEEPSEEK_API_KEY
    supports_vision: false
    supports_tools: true
    supports_json_mode: true
    price_in_per_m: 0.27            # verify
    price_out_per_m: 1.10           # verify

  # Newer OpenAI models available on the account (listed via the models API, 2026-10-19).
  # They reject max_tokens/temperature, so they use max_completion_tokens and no temperature.
  # Reasoning tokens count against max_tokens, hence the larger budget. Pricing not filled in.
  openai-gpt-6.1-sol: &openai_reasoning
    provider: openai_compatible
    base_url: https://api.openai.com/v1
    model: gpt-6.1-sol
    api_key_env: OPENAI_API_KEY
    supports_vision: true
    supports_tools: false           # gpt-6.x / 5.6: function tools need the Responses API -> JSON mode
    supports_json_mode: true
    token_param: max_completion_tokens
    temperature: null
    max_tokens: 16000
    timeout_s: 180
  openai-gpt-6-sol: {<<: *openai_reasoning, model: gpt-6-sol}
  openai-gpt-6-luna: {<<: *openai_reasoning, model: gpt-6-luna}
  openai-gpt-6-astra: {<<: *openai_reasoning, model: gpt-6-astra}
  openai-gpt-5.6-sol: {<<: *openai_reasoning, model: gpt-5.6-sol}
  openai-gpt-5.6-luna: {<<: *openai_reasoning, model: gpt-5.6-luna}
  openai-gpt-5.6-terra: {<<: *openai_reasoning, model: gpt-5.6-terra}
  openai-gpt-5.5: {<<: *openai_reasoning, model: gpt-5.5, supports_tools: true}
  openai-gpt-5.4-mini: {<<: *openai_reasoning, model: gpt-5.4-mini, supports_tools: true}

  openai-vision:
    provider: openai_compatible
    base_url: https://api.openai.com/v1
    model: gpt-4.1                  # older baseline; see the openai-gpt-* profiles above
    api_key_env: OPENAI_API_KEY
    supports_vision: true
    supports_tools: true
    supports_json_mode: true

  claude-vision:
    provider: anthropic
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    supports_vision: true
    supports_tools: true
